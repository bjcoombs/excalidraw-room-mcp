name: release

# Publishing is tag-driven: pushing v<semver> attaches the MCP Bundle to the
# matching GitHub release and publishes that commit to npm. The publish job
# carries id-token: write so npm trusted publishing (OIDC) can authenticate the
# run and npm publish can carry --provenance.
#
# workflow_dispatch exists because a failed publish cannot be retried by
# re-running the tag's workflow: that would re-run the workflow file as it was
# at the tag. Dispatching from main runs the current file against an existing
# tag, skipping the release job.
#
# The two jobs are deliberately separate. The release carries the bundle, which
# is the only way a Claude Desktop user installs this server, so it must not
# depend on npm accepting the publish - a first-publish or auth failure there
# used to mean no release was created at all and the bundle never shipped.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing tag to publish to npm, e.g. v0.4.0"
        required: true

jobs:
  release:
    # Only tag pushes create a release; a dispatch publishes an existing tag,
    # whose release already exists.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build the MCP Bundle
        # npm test has already built dist/. Dropping the dev dependencies keeps
        # the bundle to what the server needs at runtime. This job never
        # publishes, so it does not need them back afterwards.
        run: |
          npm prune --omit=dev
          npx -y @anthropic-ai/mcpb pack . excalidraw-room-mcp.mcpb
      - name: Verify the bundle contents
        # Guards the .mcpbignore trap that shipped a v0.3.0 bundle with no
        # dist/view/canvas.html. Checks the artifact about to be attached.
        run: npm run check:bundle -- excalidraw-room-mcp.mcpb
      - name: Create the GitHub release with the bundle attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" excalidraw-room-mcp.mcpb --generate-notes

  publish:
    # After the release, so a failing publish cannot withhold the bundle. Runs
    # from a clean checkout: prepublishOnly rebuilds dist/ and needs the dev
    # dependencies the release job pruned.
    #
    # always() lets a dispatch through: the release job is skipped there, and a
    # skipped dependency would otherwise skip this job too.
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Check the checked-out version matches the tag
        # A dispatch takes an arbitrary ref. Without this a typo in the input
        # would publish whatever version that ref happens to carry.
        env:
          TAG: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          expected="${TAG#v}"
          actual="$(node -p 'require("./package.json").version')"
          if [ "$expected" != "$actual" ]; then
            echo "Refusing to publish: tag $TAG implies version $expected, but package.json is $actual." >&2
            exit 1
          fi
          echo "Publishing version $actual for tag $TAG."
      - name: Publish to npm
        env:
          # Used for the first publish: npm trusted publishing can only be
          # attached to a package that already exists, so OIDC alone 404s on a
          # package npm has never seen. Once the trusted publisher is
          # configured on npmjs.com the secret can be deleted and this line
          # removed, and the step falls back to OIDC. --provenance still works
          # with token auth inside GitHub Actions.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
