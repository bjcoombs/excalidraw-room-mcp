name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mutation testing only: Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Line coverage (files loaded by the unit tests)'
            echo '```'
            if [[ -f coverage/lcov.info ]]; then
              awk '/^SF:/{f=substr($0,4)} /^LF:/{lf=substr($0,4)} /^LH:/{lh=substr($0,4)} /^end_of_record/{printf "%-24s %3d%% (%s/%s)\n", f, (lf>0?100*lh/lf:0), lh, lf}' coverage/lcov.info
            else
              echo 'No LCOV report was produced.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  mutation:
    # Minutes rather than seconds even after tuning, so it is kept off the push
    # path entirely: weekly on a schedule and on demand (gh workflow run
    # ci.yml). Stryker runs the TypeScript sources directly through tsx, so
    # there is no compile step per mutant and no build step here.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stryker reuses results for mutants whose source and covering tests are
      # unchanged. The key is hashed over all of src so any change starts a new
      # cache entry, while restore-keys seeds it from the most recent run.
      - name: Restore Stryker incremental cache
        uses: actions/cache@v4
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ hashFiles('src/**/*.ts') }}
          restore-keys: |
            stryker-incremental-
      - run: npm run mutate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
